<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>איך זה עובד</title>
<meta name="description" content="הסברים קצרים ומאוירים על איך דברים עובדים — ממנוע בעירה ועד מפסק פחת.">
<meta name="theme-color" content="#f7f5f0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1114" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="scenes/scene.css">
<style>
@font-face{font-family:"Frank Ruhl Libre";font-style:normal;font-weight:300 900;font-display:swap;
  src:url(fonts/frank-ruhl-libre-hebrew-wght-normal.woff2) format("woff2");
  unicode-range:U+0307-0308,U+0590-05FF,U+200C-2010,U+20AA,U+25CC,U+FB1D-FB4F}
@font-face{font-family:"Frank Ruhl Libre";font-style:normal;font-weight:300 900;font-display:swap;
  src:url(fonts/frank-ruhl-libre-latin-wght-normal.woff2) format("woff2");
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-200B,U+2011-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"Heebo";font-style:normal;font-weight:100 900;font-display:swap;
  src:url(fonts/heebo-hebrew-wght-normal.woff2) format("woff2");
  unicode-range:U+0307-0308,U+0590-05FF,U+200C-2010,U+20AA,U+25CC,U+FB1D-FB4F}
@font-face{font-family:"Heebo";font-style:normal;font-weight:100 900;font-display:swap;
  src:url(fonts/heebo-latin-wght-normal.woff2) format("woff2");
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-200B,U+2011-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}

:root{
  --bg:#f7f5f0; --card:#ffffff; --ink:#15171a; --muted:#646870; --faint:#9b9ea5; --line:#e1ddd4;
  --accent:#14595c; --accent-ink:#ffffff; --soft:#e7efee;
  --ok:#1d7a48; --ok-bg:#e4f3ea; --bad:#b23a2c; --bad-bg:#f8e7e3;
  --serif:"Frank Ruhl Libre","David Libre","David","Times New Roman",serif;
  --sans:"Heebo",system-ui,-apple-system,"Segoe UI","Arial Hebrew",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0f1114; --card:#171a1f; --ink:#ecebe7; --muted:#9a9da4; --faint:#6d7078; --line:#292d34;
    --accent:#6fc7bf; --accent-ink:#0a1415; --soft:#18292a;
    --ok:#62c98b; --ok-bg:#15301f; --bad:#f08b7c; --bad-bg:#3a1d19;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.65;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
#app{max-width:600px;margin:0 auto;padding:max(18px,env(safe-area-inset-top)) 20px calc(28px + env(safe-area-inset-bottom));
  min-height:100dvh;display:flex;flex-direction:column}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
p{margin:0 0 12px}
svg.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* ---------- מעטפת וניווט ---------- */
#app.with-tabs{padding-bottom:calc(92px + env(safe-area-inset-bottom))}
.tabbar{position:fixed;inset-inline:0;bottom:0;z-index:5;display:flex;justify-content:center;
  background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
.tab{flex:1;max-width:150px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0 4px;
  font-size:11.5px;color:var(--faint);font-weight:500}
.tab.on{color:var(--accent);font-weight:600}
.tab svg{width:23px;height:23px}
.tab-ic{position:relative;display:flex}
.dot{position:absolute;top:-2px;inset-inline-end:-5px;width:8px;height:8px;border-radius:50%;background:var(--bad);border:2px solid var(--bg);box-sizing:content-box}

.kicker{font-size:12px;font-weight:600;letter-spacing:.09em;color:var(--accent)}
.meta{font-size:13px;color:var(--faint)}
.brand{font-family:var(--serif);font-weight:700;font-size:28px;letter-spacing:-.3px;margin:0;line-height:1.15}
.bar{display:block;height:3px;border-radius:2px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:2px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:24px 0 10px}
.sec-head h2{font-family:var(--serif);font-weight:700;font-size:21px;margin:0}
.sec-head a{display:flex;align-items:center;gap:2px;font-size:13.5px;color:var(--accent);font-weight:500}
.sec-head a svg{width:16px;height:16px}
.thumb{aspect-ratio:320/220;background:var(--soft)}
.thumb .scene{margin:0;border-radius:0}

/* ---------- בית ---------- */
.hello{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:4px 0 16px}
.hello-sub{display:block;font-size:14px;color:var(--muted);margin-bottom:2px}
.pill{font-size:13px;font-weight:500;color:var(--accent);background:var(--soft);border-radius:999px;padding:6px 14px;white-space:nowrap}

.hero{display:block;background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;
  box-shadow:0 1px 2px rgba(20,20,20,.04),0 12px 28px -18px rgba(20,20,20,.25)}
.hero-body{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:16px 18px 18px}
.hero h2{font-family:var(--serif);font-weight:700;font-size:26px;line-height:1.15;margin:4px 0 2px;letter-spacing:-.3px}
.hero p{color:var(--muted);margin:0;font-size:15px;line-height:1.45}
.hero .btn{flex:none}

.notice{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px;padding:14px 18px;
  border-radius:14px;background:var(--soft);font-size:15px}
.notice b{font-weight:700}
.notice .go{display:flex;align-items:center;gap:4px;color:var(--accent);font-weight:600}
.notice .go svg{width:18px;height:18px}

.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{display:flex;flex-direction:column;gap:1px;padding:13px 12px 12px;background:var(--card);border:1px solid var(--line);border-radius:16px}
.tile-ic{width:36px;height:36px;border-radius:10px;background:var(--soft);color:var(--accent);display:grid;place-items:center;margin-bottom:9px}
.tile-ic svg{width:20px;height:20px}
.tile b{font-family:var(--serif);font-weight:700;font-size:16.5px;line-height:1.2}
.tile small{font-size:12.5px;color:var(--muted)}
.tile .bar{margin-top:auto;transform:translateY(4px)}
.tile small{margin-bottom:8px}
.tile:active,.mini:active,.hero:active{transform:scale(.985)}
.tile,.mini,.hero{transition:transform .12s}

.rail{display:flex;gap:12px;overflow-x:auto;margin:0 -20px;padding:2px 20px 6px;scroll-snap-type:x proximity;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.mini{flex:none;width:212px;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;scroll-snap-align:start;padding-bottom:14px}
.mini b{display:block;font-family:var(--serif);font-weight:700;font-size:18px;line-height:1.25;margin:12px 14px 2px}
.mini small{display:block;font-size:13.5px;color:var(--muted);margin:0 14px;line-height:1.45}

/* ---------- ספרייה, התקדמות, חזרה ---------- */
.page-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:8px 0 6px}
.page-head h1{font-family:var(--serif);font-weight:700;font-size:30px;margin:0;letter-spacing:-.3px}

.tools{position:sticky;top:0;z-index:2;background:var(--bg);margin:6px -20px 0;padding:10px 20px 10px}
.search{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 14px;color:var(--muted)}
.search:focus-within{border-color:var(--accent)}
.search input{flex:1;min-width:0;border:0;background:none;color:var(--ink);font:inherit;outline:none;padding:0}
.search input::placeholder{color:var(--faint)}
.chips{display:flex;gap:8px;overflow-x:auto;margin:12px -20px 0;padding:0 20px 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:6px 14px;border:1px solid var(--line);border-radius:999px;font-size:14px;color:var(--muted);background:var(--card);white-space:nowrap}
.chip[aria-current="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg);font-weight:500}

.group{font-size:12px;font-weight:600;letter-spacing:.09em;color:var(--faint);margin:24px 0 2px}
.row{display:flex;align-items:baseline;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.row-n{font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums;width:20px;flex:none}
.row-text{flex:1;min-width:0}
.row-text b{display:block;font-family:var(--serif);font-weight:700;font-size:19.5px;line-height:1.25}
.row-text small{display:block;color:var(--muted);font-size:14.5px;margin-top:1px}
.row-mark{align-self:center;color:var(--faint);display:flex}
.row.done .row-mark{color:var(--ok)}
.row.done .row-text b{color:var(--muted)}
.empty{text-align:center;color:var(--muted);margin-top:40px}

.figures{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.figures div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 8px;text-align:center}
.figures b{display:block;font-family:var(--serif);font-size:32px;line-height:1.1;font-weight:700;font-variant-numeric:tabular-nums}
.figures span{font-size:12.5px;color:var(--muted)}
.prog{display:block;padding:13px 0;border-bottom:1px solid var(--line)}
.prog-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px}
.prog-top b{font-weight:500}
.prog-top small{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}

.center{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;padding:30px 0}
.center h2{font-family:var(--serif);font-weight:700;font-size:28px;line-height:1.2;margin:8px 0 10px}
.center p{color:var(--muted);margin-bottom:24px}

footer{margin-top:auto;padding-top:36px;text-align:center}
.link{color:var(--muted);font-size:13px;text-decoration:underline;text-underline-offset:3px;padding:8px}

/* ---------- כפתורים ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 24px;border-radius:10px;
  background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:16px;border:1px solid var(--accent)}
.btn.sm{min-height:42px;padding:0 18px;font-size:15px}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn:disabled{opacity:.35;cursor:default}

/* ---------- נגן ---------- */
.p-top{display:flex;align-items:center;gap:14px;padding:2px 0 16px}
.close{width:36px;height:36px;display:grid;place-items:center;color:var(--muted);margin-inline-start:-8px;flex:none}
.segs{flex:1;display:flex;gap:4px}
.segs i{flex:1;height:3px;border-radius:2px;background:var(--line)}
.segs i.on{background:var(--accent)}
.p-title{font-size:13px;color:var(--muted);white-space:nowrap;max-width:40%;overflow:hidden;text-overflow:ellipsis}

.stage{flex:1;display:flex;flex-direction:column;justify-content:center;padding:6px 0}
.card{animation:in .28s ease-out}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.card{animation:none}}
.card .scene{margin:0 0 20px;border-radius:12px;border:1px solid var(--line)}
.card h3{font-family:var(--serif);font-weight:700;font-size:27px;line-height:1.22;margin:8px 0 10px;letter-spacing:-.2px}
.card p{font-size:17.5px;line-height:1.75}
.muted{color:var(--muted);font-size:15px!important}
.big{font-size:56px;line-height:1.1;margin-bottom:10px}

.speak{display:inline-flex;align-items:center;gap:8px;color:var(--muted);font-size:14px;padding:6px 0;margin-top:2px}
.speak svg{width:18px;height:18px}

.opts{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.opt{display:flex;gap:14px;align-items:baseline;text-align:start;padding:15px 16px;border-radius:10px;border:1px solid var(--line);
  background:var(--card);line-height:1.5;width:100%}
.opt i{font-style:normal;font-family:var(--serif);font-weight:700;color:var(--faint);flex:none}
.opt:not(:disabled):active{border-color:var(--accent)}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.right i{color:var(--ok)} .opt.wrong i{color:var(--bad)}
.opt:disabled{cursor:default;color:var(--ink)}
.reveal{margin-top:16px;padding:2px 16px 2px 0;border-inline-start:3px solid var(--accent);font-size:16.5px;line-height:1.7}
.reveal b{font-weight:600}

.myth blockquote{margin:10px 0 18px;padding:0;font-family:var(--serif);font-size:25px;line-height:1.35;font-weight:500}
.myth blockquote::before{content:"״";color:var(--accent)}
.myth blockquote::after{content:"״";color:var(--accent)}
.myth .label{font-weight:600;color:var(--accent)}

.end h3{font-size:25px;font-weight:500;line-height:1.4}

.p-nav{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:18px}
.p-nav .btn{flex:1;max-width:340px;margin-inline-start:auto}
.back{color:var(--muted);font-size:15px;padding:12px 4px}
.back:disabled{visibility:hidden}
</style>
</head>
<body>
<div id="app"></div>
<script type="module" src="app.js"></script>
</body>
</html>
