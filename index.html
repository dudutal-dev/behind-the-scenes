<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>מאחורי הקלעים</title>
<meta name="description" content="מאחורי הקלעים: הסברים קצרים ומאוירים על איך דברים עובדים — ממנוע בעירה ועד מפסק פחת.">
<meta name="theme-color" content="#f5f6fb">
<script>
// ערכת צבעים: בהירה כברירת מחדל. הבחירה (light / dark / auto) נשמרת במכשיר.
(function () {
  var KEY = "eich-ze-oved-theme", mq = matchMedia("(prefers-color-scheme: dark)");
  function apply() {
    var pref = "light";
    try { pref = localStorage.getItem(KEY) || "light"; } catch (e) {}
    var dark = pref === "dark" || (pref === "auto" && mq.matches);
    document.documentElement.dataset.theme = dark ? "dark" : "light";
    document.querySelector('meta[name="theme-color"]').content = dark ? "#0b0d15" : "#f5f6fb";
    return pref;
  }
  window.applyTheme = apply;
  mq.addEventListener && mq.addEventListener("change", apply);
  apply();
})();
</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="scenes/scene.css">
<style>
@font-face{font-family:"Heebo";font-style:normal;font-weight:100 900;font-display:swap;
  src:url(fonts/heebo-hebrew-wght-normal.woff2) format("woff2");
  unicode-range:U+0307-0308,U+0590-05FF,U+200C-2010,U+20AA,U+25CC,U+FB1D-FB4F}
@font-face{font-family:"Heebo";font-style:normal;font-weight:100 900;font-display:swap;
  src:url(fonts/heebo-latin-wght-normal.woff2) format("woff2");
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-200B,U+2011-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}

:root{
  --bg:#f5f6fb; --card:#ffffff; --ink:#0e1120; --muted:#5d6278; --faint:#9499ad; --line:#e6e8f1; --soft:#eceefa;
  --a1:#1668e3; --a2:#2e9bf0; --accent:#1668e3; --accent-ink:#ffffff;
  --ok:#12a150; --ok-bg:#e3f7ea; --bad:#e0413a; --bad-bg:#fdeae8; --warn:#d97706; --warn-bg:#fdf1dd; --past:#8a5a2b; --past-bg:#f4e9dc;
  --shadow:0 1px 2px rgba(14,17,32,.04),0 10px 30px -16px rgba(14,17,32,.22);
  --c1:var(--a1); --c2:var(--a2);
  --sans:"Heebo",system-ui,-apple-system,"Segoe UI","Arial Hebrew",Arial,sans-serif;
}
:root[data-theme="dark"]{
    --bg:#0b0d15; --card:#141725; --ink:#eef0f8; --muted:#a0a5bb; --faint:#6c7189; --line:#22263a; --soft:#1a1e33;
    --a1:#2f7df0; --a2:#3fa6f5; --accent:#6fb0ff; --accent-ink:#0b0d15;
    --ok:#4fd28a; --ok-bg:#11301f; --bad:#ff7f76; --bad-bg:#3a1917; --warn:#fbbf4d; --warn-bg:#3a2a0e; --past:#e0b98a; --past-bg:#33271a;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 14px 34px -18px rgba(0,0,0,.8);
  color-scheme:dark;
}
/* צבע לכל תחום */
.c-home{--c1:#ff9f43;--c2:#ff5c6c} .c-move{--c1:#38bdf8;--c2:#3b6cf6} .c-tech{--c1:#e060f5;--c2:#8b5cf6}
.c-energy{--c1:#fbbf24;--c2:#f97316} .c-infra{--c1:#d4a373;--c2:#9a6233} .c-nature{--c1:#84d955;--c2:#16a34a}
.c-ai{--c1:#7b8aa5;--c2:#1e293b} .c-invent{--c1:#fb7fa5;--c2:#e11d6a} .c-body{--c1:#ff8f8f;--c2:#e5383b} .c-space{--c1:#7f8cff;--c2:#2f2a9b} .c-digital{--c1:#4fe3d0;--c2:#0891b2}
.t-home{--c1:#5aa9ff;--c2:#1668e3} .t-lib{--c1:#ffb238;--c2:#f97316} .t-review{--c1:#4fe3a8;--c2:#0fa36b} .t-me{--c1:#ff8fb5;--c2:#e11d6a} .t-set{--c1:#5fd3e6;--c2:#0b86ab}
.c-flame{--c1:#ffb238;--c2:#ff5a3c} .c-done{--c1:#4ade80;--c2:#12a150} .c-review{--c1:#5aa9ff;--c2:#1668e3}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.6;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
#app{max-width:600px;margin:0 auto;padding:max(18px,env(safe-area-inset-top)) 20px calc(28px + env(safe-area-inset-bottom));
  min-height:100dvh;display:flex;flex-direction:column}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
p{margin:0 0 12px}
h1,h2,h3{margin:0;font-weight:800;letter-spacing:-.02em;line-height:1.15}
svg.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.view{display:flex;flex-direction:column;flex:1;animation:view .3s ease-out}
@keyframes view{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.view,.card,.reveal{animation:none!important}}

/* ---------- רכיבים משותפים ---------- */
.badge{display:grid;place-items:center;flex:none;width:46px;height:46px;border-radius:15px;color:#fff;
  background:linear-gradient(140deg,var(--c1),var(--c2));
  box-shadow:0 8px 16px -8px var(--c2),inset 0 1px 0 rgba(255,255,255,.35)}
.badge svg{width:26px;height:26px;fill:currentColor}
.badge.sm{width:38px;height:38px;border-radius:12px} .badge.sm svg{width:21px;height:21px}
.badge.lg{width:76px;height:76px;border-radius:24px} .badge.lg svg{width:42px;height:42px}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;color:var(--c2);
  background:color-mix(in srgb,var(--c2) 13%,transparent);border-radius:999px;padding:3px 10px}
.tag svg{width:14px;height:14px;fill:currentColor}
.tag.warn{color:var(--warn);background:var(--warn-bg)}
.tag.past-tag{color:var(--past);background:var(--past-bg)}
.tag.done{color:var(--ok);background:var(--ok-bg)}
[data-theme="dark"] .tag{color:var(--c1);background:color-mix(in srgb,var(--c1) 16%,transparent)}
.meta{font-size:13px;color:var(--faint)}
.bar{display:block;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--c2),var(--c1));border-radius:3px;transition:width .5s}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:26px 0 12px}
.sec-head h2{font-size:20px}
.sec-head a{display:flex;align-items:center;gap:2px;font-size:14px;color:var(--accent);font-weight:600}
.sec-head a svg{width:16px;height:16px}
.thumb{aspect-ratio:320/220;background:var(--soft)}
.thumb .scene{margin:0;border-radius:0}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:52px;padding:0 26px;border-radius:16px;
  background:linear-gradient(135deg,var(--a1),var(--a2));color:#fff;font-weight:700;font-size:16.5px;
  box-shadow:0 10px 22px -10px var(--a1);transition:transform .12s,opacity .2s}
.btn svg{width:18px;height:18px;stroke-width:2.4}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.35;box-shadow:none;cursor:default}

/* ---------- ניווט תחתון ---------- */
#app.with-tabs{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
.tabbar{position:fixed;inset-inline:0;bottom:0;z-index:5;display:flex;justify-content:center;gap:4px;
  background:color-mix(in srgb,var(--card) 86%,transparent);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);
  border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom))}
.tab{flex:1;max-width:120px;min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11.5px;color:var(--faint);font-weight:600}
.tab-ic{position:relative;display:grid;place-items:center;width:44px;height:36px;border-radius:13px;transition:transform .2s,background .2s,box-shadow .2s}
.tab svg{width:25px;height:25px;fill:currentColor;transition:fill .2s}
.tab:not(.on) svg{fill:color-mix(in srgb,var(--c2) 38%,var(--faint))}
.tab.on{color:var(--ink)}
.tab.on .tab-ic{background:linear-gradient(140deg,var(--c1),var(--c2));box-shadow:0 8px 16px -8px var(--c2),inset 0 1px 0 rgba(255,255,255,.35);transform:translateY(-2px)}
.tab.on svg{fill:#fff}
.dot{position:absolute;top:-1px;inset-inline-end:-3px;width:9px;height:9px;border-radius:50%;background:var(--bad);border:2px solid var(--card);box-sizing:content-box}

/* ---------- מסך פתיחה ---------- */
#app.welcome{height:100vh;height:100dvh;min-height:0;overflow:hidden;padding-top:max(22px,env(safe-area-inset-top));--w:var(--accent);
  background:radial-gradient(90% 40% at 50% 0%,color-mix(in srgb,var(--w) 13%,transparent),transparent 75%)}
.w-scroll{flex:1;min-height:0;overflow-y:auto;scrollbar-width:none;display:flex;flex-direction:column;animation:view .5s ease-out}
.w-scroll::-webkit-scrollbar{display:none}
.w-hero{text-align:center;margin-top:auto;padding-top:8px}
.w-hero img{border-radius:20px;box-shadow:var(--shadow)}
.w-hero .brand em{background:none;-webkit-background-clip:border-box;background-clip:border-box;color:var(--w)}
.w-hero .brand{font-size:34px;margin-top:12px;white-space:normal}
.w-hero p{color:var(--muted);font-size:16px;font-weight:500;margin:4px 0 0}
.w-list .badge{background:color-mix(in srgb,var(--c2) 15%,var(--card));color:var(--c2);box-shadow:none}
.w-list{list-style:none;margin:26px 0 auto;padding:4px 16px;background:color-mix(in srgb,var(--card) 82%,transparent);border:1px solid var(--line);
  border-radius:22px;box-shadow:var(--shadow);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.w-list li{display:flex;align-items:center;gap:13px;padding:9px 0;border-top:1px solid var(--line)}
.w-list li:first-child{border-top:0}
.w-list b{display:block;font-size:16px;font-weight:800;line-height:1.3}
.w-list small{display:block;font-size:13.5px;color:var(--muted);line-height:1.45}
.w-hero p.w-stats{font-size:13.5px;margin-top:8px}
.w-stats b{color:var(--ink);font-weight:800}
.w-foot{flex:none;padding-top:12px;text-align:center}
.w-foot .btn{width:100%;min-height:56px;font-size:18px;border-radius:18px;box-shadow:0 12px 24px -14px var(--a1)}
.w-foot small{display:block;margin-top:10px;color:var(--faint);font-size:12.5px}
@media (prefers-reduced-motion: reduce){.w-scroll{animation:none}}

/* ---------- בית ---------- */
.hello{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:4px 0 18px}
.hello-side{display:flex;align-items:center;gap:8px}
.icon-btn{display:grid;place-items:center;width:46px;height:46px;border-radius:16px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);color:var(--muted);flex:none}
.icon-btn.flat{width:38px;height:38px;border-radius:12px;box-shadow:none;background:var(--soft);border:0}
.brand{white-space:nowrap}
.hello-sub{display:block;font-size:14px;color:var(--muted);font-weight:500}
.brand{font-size:30px;font-weight:900;letter-spacing:-.03em}
.brand em{font-style:normal;background:linear-gradient(135deg,var(--a1),var(--a2));-webkit-background-clip:text;background-clip:text;color:transparent}
.streak{display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:6px 8px 6px 14px;box-shadow:var(--shadow)}
.streak span{display:flex;flex-direction:column;line-height:1.05;font-size:11.5px;color:var(--muted);font-weight:500}
.streak b{font-size:19px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}

.hero{position:relative;display:block;background:var(--card);border-radius:24px;overflow:hidden;box-shadow:var(--shadow);border:1px solid var(--line);transition:transform .14s}
.hero:active,.tile:active,.mini:active,.notice:active{transform:scale(.985)}
.chip-float{position:absolute;top:14px;inset-inline-start:14px;display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:#fff;
  background:linear-gradient(135deg,var(--a1),var(--a2));border-radius:999px;padding:6px 12px 6px 12px;box-shadow:0 8px 18px -8px var(--a1)}
.chip-float svg{width:15px;height:15px;fill:currentColor}
.hero-body{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:16px 18px 18px}
.hero h2{font-size:25px;margin:8px 0 3px}
.hero p{color:var(--muted);margin:0;font-size:15px;line-height:1.45}
.fab{flex:none;display:grid;place-items:center;width:52px;height:52px;border-radius:18px;color:#fff;
  background:linear-gradient(135deg,var(--a1),var(--a2));box-shadow:0 10px 22px -10px var(--a1)}
.fab svg{width:24px;height:24px;stroke-width:2.4}

.notice{display:flex;align-items:center;gap:12px;margin-top:14px;padding:12px 14px;border-radius:18px;background:var(--card);
  border:1px solid var(--line);box-shadow:var(--shadow);transition:transform .14s}
.notice-text{flex:1;display:flex;flex-direction:column;line-height:1.3}
.notice-text b{font-size:15.5px;font-weight:700}
.notice-text small{font-size:13px;color:var(--muted)}
.notice>svg.ic{color:var(--faint)}

.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{display:flex;flex-direction:column;padding:14px 12px 13px;background:var(--card);border:1px solid var(--line);border-radius:20px;
  box-shadow:var(--shadow);transition:transform .14s}
.tile .badge{margin-bottom:11px}
.tile b{font-size:15.5px;font-weight:700;line-height:1.2}
.tile small{font-size:12.5px;color:var(--muted);margin:2px 0 11px}
.tile .bar{margin-top:auto}
/* אריח בודד בשורה האחרונה נמתח לכל הרוחב */
.tile:last-child:nth-child(3n+1){grid-column:1/-1;display:grid;grid-template-columns:auto 1fr;column-gap:14px;align-items:center;padding:14px 16px}
.tile:last-child:nth-child(3n+1) .badge{grid-row:1/3;margin:0}
.tile:last-child:nth-child(3n+1) b{align-self:end;font-size:16.5px}
.tile:last-child:nth-child(3n+1) small{align-self:start;margin:0}
.tile:last-child:nth-child(3n+1) .bar{grid-column:1/-1;margin-top:12px}

.rail{display:flex;gap:12px;overflow-x:auto;margin:0 -20px;padding:2px 20px 14px;scroll-snap-type:x proximity;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.mini{flex:none;width:220px;background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;scroll-snap-align:start;
  padding-bottom:14px;box-shadow:var(--shadow);transition:transform .14s}
.mini .tag{margin:12px 14px 0}
.mini b{display:block;font-size:17px;font-weight:700;line-height:1.25;margin:6px 14px 2px}
.mini small{display:block;font-size:13.5px;color:var(--muted);margin:0 14px;line-height:1.45}
.foot-note{text-align:center;font-size:13px;color:var(--faint);margin:14px 0 0}

/* ---------- ספרייה ---------- */
.page-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:6px 0 6px}
.page-head h1{font-size:30px;font-weight:900;letter-spacing:-.03em}
.tools{position:sticky;top:0;z-index:2;background:var(--bg);margin:6px -20px 0;padding:10px 20px 10px}
.search{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px 16px;color:var(--faint);box-shadow:var(--shadow)}
.search:focus-within{border-color:var(--accent);color:var(--accent)}
.search input{flex:1;min-width:0;border:0;background:none;color:var(--ink);font:inherit;outline:none;padding:0}
.search input::placeholder{color:var(--faint)}
.chips{display:flex;gap:8px;overflow-x:auto;margin:12px -20px 0;padding:0 20px 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:7px;padding:7px 14px;border:1px solid var(--line);border-radius:999px;font-size:14px;font-weight:500;
  color:var(--muted);background:var(--card);white-space:nowrap}
.chip i{width:9px;height:9px;border-radius:50%;background:linear-gradient(140deg,var(--c1),var(--c2))}
.chip[aria-current="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg);font-weight:600}

.group{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;margin:24px 2px 10px}
.group span{font-size:12px;font-weight:600;color:var(--faint);background:var(--soft);border-radius:999px;padding:1px 8px}
.rows{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.row{display:flex;align-items:center;gap:13px;padding:12px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row:active{background:var(--soft)}
.row-text{flex:1;min-width:0}
.row-text b{display:block;font-weight:700;font-size:16.5px;line-height:1.3}
.row-text small{display:block;color:var(--muted);font-size:13.5px;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-mark{color:var(--faint);display:flex}
.row-mark svg{width:20px;height:20px}
.row.done .row-mark{color:var(--ok)} .row.done .row-mark svg{fill:currentColor;width:24px;height:24px}
.empty{text-align:center;color:var(--muted);margin-top:40px;line-height:1.7}
.row-text mark{background:color-mix(in srgb,var(--a2) 22%,transparent);color:inherit;border-radius:4px;padding:0 2px}
.pill{font-style:normal;font-size:11px;font-weight:700;color:var(--accent);background:color-mix(in srgb,var(--accent) 13%,transparent);border-radius:999px;padding:1px 8px;margin-inline-start:8px;vertical-align:2px}
.fav-mark{display:inline-block;margin-inline-start:6px;color:var(--warn);vertical-align:-2px}
.fav-mark svg{width:14px;height:14px;fill:currentColor}
.chip svg{width:13px;height:13px;fill:var(--warn)}
.chip[aria-current="true"] svg{fill:currentColor}

/* ---------- הגדרות ---------- */
.page-head a.meta{display:flex;align-items:center;gap:2px;color:var(--accent);font-weight:600}
.page-head a.meta svg{width:15px;height:15px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:16px 18px;margin-bottom:12px}
.panel p{font-size:15.5px;line-height:1.65;color:var(--muted)}
.panel p:last-child{margin-bottom:0}
.panel p b{color:var(--ink);font-weight:700}
.btn-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.btn.sm{min-height:44px;padding:0 18px;font-size:15px;border-radius:14px}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.danger{background:var(--bad);box-shadow:none}
.msg{margin-top:12px!important;padding:10px 14px;border-radius:12px;background:var(--ok-bg);color:var(--ok)!important;font-weight:600}
.msg.bad{background:var(--bad-bg);color:var(--bad)!important}
.about{display:flex;align-items:center;gap:14px}
.about img{border-radius:16px;flex:none}
.about b{display:block;font-size:19px;font-weight:800}
.about small{display:block;color:var(--muted);font-size:13.5px}
.about small.dev{margin-top:3px;color:var(--ink);font-weight:600}
#list>section:first-child .rows{margin-top:10px}

/* ---------- התקדמות וחזרה ---------- */
.summary{display:flex;align-items:center;gap:16px;margin-top:10px;padding:18px;border-radius:24px;color:#fff;
  background:linear-gradient(135deg,var(--a1),var(--a2));box-shadow:0 16px 30px -18px var(--a1)}
.summary b{display:block;font-size:20px;font-weight:800}
.summary small{font-size:14px;opacity:.9;line-height:1.4;display:block}
.ring{flex:none;width:76px;height:76px;border-radius:50%;display:grid;place-items:center;
  background:conic-gradient(#fff calc(var(--p)*1%),rgba(255,255,255,.25) 0)}
.ring b{display:grid;place-items:center;width:60px;height:60px;border-radius:50%;background:color-mix(in srgb,var(--a1) 55%,var(--a2));font-size:17px;font-variant-numeric:tabular-nums}
.figures{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.figures div{display:flex;flex-direction:column;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px 13px;box-shadow:var(--shadow)}
.figures b{font-size:28px;line-height:1.1;font-weight:800;font-variant-numeric:tabular-nums;margin-top:10px}
.figures span:last-child{font-size:12.5px;color:var(--muted)}
.prog{display:flex;align-items:center;gap:13px;padding:13px 14px;border-top:1px solid var(--line)}
.prog:first-child{border-top:0}
.prog-body{flex:1}
.prog-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.prog-top b{font-weight:700;font-size:15.5px}
.prog-top small{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}

.center{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:30px 6px}
.center h2{font-size:26px;margin:22px 0 10px}
.center p{color:var(--muted);margin-bottom:26px;max-width:34ch}
footer{margin-top:auto;padding-top:34px;text-align:center}
.link{color:var(--faint);font-size:13px;text-decoration:underline;text-underline-offset:3px;padding:8px}

/* ---------- נגן ---------- */
.p-top{display:flex;align-items:center;gap:12px;padding:0 0 16px}
.close{width:40px;height:40px;display:grid;place-items:center;color:var(--muted);flex:none;border-radius:14px;background:var(--card);border:1px solid var(--line)}
.segs{flex:1;display:flex;gap:4px}
.segs i{flex:1;height:5px;border-radius:3px;background:var(--line);transition:background .3s}
.segs i.on{background:linear-gradient(90deg,var(--c2),var(--c1))}
.p-title{font-size:13px;color:var(--muted);font-weight:600;white-space:nowrap;max-width:30%;overflow:hidden;text-overflow:ellipsis}
.fav{width:40px;height:40px;display:grid;place-items:center;flex:none;border-radius:14px;background:var(--card);border:1px solid var(--line);color:var(--faint);transition:transform .15s}
.fav svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8}
.fav.on{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,var(--line))}
.fav.on svg{fill:currentColor}
.fav:active{transform:scale(.9)}

/* הנגן הוא מסך בגובה קבוע: רק אזור התוכן נגלל, והכפתורים נשארים תמיד למטה.
   כך אין לדף עצמו לאן להיגלל, ולא נוצר שטח ריק מתחת לכפתור. */
#app.player{height:100vh;height:100dvh;min-height:0;overflow:hidden}
.player .p-top,.player .p-nav{flex:none}
.stage{flex:1;min-height:0;display:flex;flex-direction:column;padding:4px 2px 10px;margin:0 -2px;
  overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.stage::-webkit-scrollbar{display:none}
.stage>.card{margin-block:auto}
.card{animation:in .3s cubic-bezier(.2,.8,.2,1)}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.card .scene{margin:0 0 18px;border-radius:22px;border:1px solid var(--line);box-shadow:var(--shadow)}
.card h3{font-size:26px;margin:10px 0 10px}
.card p{font-size:17.5px;line-height:1.7;color:color-mix(in srgb,var(--ink) 88%,var(--muted))}
.muted{color:var(--muted)!important;font-size:15px!important}
.big{font-size:56px;line-height:1.1;margin-bottom:10px}
.speak{display:inline-flex;align-items:center;gap:8px;color:var(--muted);font-size:14px;font-weight:600;padding:8px 14px;margin-top:2px;
  border-radius:999px;background:var(--card);border:1px solid var(--line)}
.speak svg{width:18px;height:18px}

.opts{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.opt{display:flex;gap:13px;align-items:center;text-align:start;padding:13px 14px;border-radius:18px;border:1.5px solid var(--line);
  background:var(--card);line-height:1.45;width:100%;box-shadow:var(--shadow);transition:transform .12s,border-color .2s,background .2s,opacity .2s}
.opt i{font-style:normal;font-weight:800;font-size:14px;flex:none;width:32px;height:32px;border-radius:11px;display:grid;place-items:center;
  color:var(--c2);background:color-mix(in srgb,var(--c2) 13%,transparent)}
.opt:not(:disabled):active{transform:scale(.985);border-color:var(--c2)}
.opt:disabled{cursor:default;color:var(--ink);box-shadow:none}
.opt.right{border-color:var(--ok);background:var(--ok-bg)} .opt.right i{color:#fff;background:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)} .opt.wrong i{color:#fff;background:var(--bad)}
.opt.dim{opacity:.5}
.reveal{margin-top:14px;padding:13px 16px;border-radius:18px;font-size:16px;line-height:1.6;animation:in .3s cubic-bezier(.2,.8,.2,1)}
.reveal b{display:block;font-weight:800;font-size:14px;margin-bottom:2px}
.reveal.ok{background:var(--ok-bg)} .reveal.ok b{color:var(--ok)}
.reveal.no{background:var(--warn-bg)} .reveal.no b{color:var(--warn)}

.myth blockquote{margin:14px 0 18px;padding:0 16px 0 0;border-inline-start:4px solid var(--warn);font-size:23px;line-height:1.35;font-weight:700;letter-spacing:-.01em}
.truth{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;box-shadow:var(--shadow)}
.truth b{display:block;font-size:13px;font-weight:800;color:var(--ok);margin-bottom:2px}
.truth p{margin:0;font-size:16.5px;line-height:1.65}
.past p{font-size:20px;line-height:1.7;margin-top:14px;padding-inline-start:16px;border-inline-start:4px solid var(--past)}
.end h3{font-size:23px;line-height:1.35;font-weight:700}
.upnext{display:flex;align-items:center;gap:13px;margin-top:6px;padding:12px 14px;border-radius:18px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow)}
.upnext small{color:var(--muted);font-size:12.5px;display:block}
.upnext b{font-size:16.500px;font-weight:700}
.upnext>svg.ic{color:var(--faint)}
/* ---------- הדמיות ---------- */
.card.sim h3{font-size:22px}
.sim-stage{touch-action:pan-y}
.card .sim-stage{margin-bottom:12px}
.sim-read{display:flex;gap:8px;margin-bottom:4px}
.sim-read div{flex:1;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:9px 13px;box-shadow:var(--shadow)}
.sim-read b{display:block;font-size:21px;font-weight:800;line-height:1.2;font-variant-numeric:tabular-nums}
.sim-read span{font-size:12.5px;color:var(--muted)}
.sim-ctl{display:grid;grid-template-columns:5.4em 1fr 5.2em;gap:10px;align-items:center;margin-top:10px;font-size:14.5px;font-weight:700}
.sim-ctl output{text-align:end;font-size:13.5px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.sim-ctl input[type=range]{width:100%;height:34px;margin:0;accent-color:var(--c2);direction:ltr}
.sim-ctl.seg{grid-template-columns:5.4em 1fr}
.seg-btns{display:flex;gap:6px}
.panel .seg-btns{--c1:var(--a2);--c2:var(--a1);margin-top:2px}
.seg-btns button{flex:1;min-height:40px;padding:6px 4px;border-radius:13px;border:1px solid var(--line);background:var(--card);font-size:14px;font-weight:700;color:var(--muted)}
.seg-btns button[aria-pressed="true"]{background:linear-gradient(140deg,var(--c1),var(--c2));border-color:transparent;color:#fff;box-shadow:0 8px 16px -10px var(--c2)}
.card.sim .muted{margin-top:12px}
.center-card{display:flex;flex-direction:column;align-items:center;text-align:center}
.center-card h3{margin-top:20px}

.p-nav{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:12px}
.p-nav .btn{flex:1;max-width:360px;margin-inline-start:auto}
.back{color:var(--muted);font-size:15px;font-weight:600;padding:12px 6px}
.back:disabled{visibility:hidden}
.home-btn{width:52px;height:52px;border-radius:16px;color:var(--accent)}
.home-btn svg{width:24px;height:24px;fill:currentColor}
.p-nav .home-btn+.btn{margin-inline-start:0}
</style>
</head>
<body>
<div id="app"></div>
<script type="module" src="app.js"></script>
</body>
</html>
