<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>איך זה עובד?</title>
<meta name="description" content="הסברים קצרים על איך דברים עובדים — מקרר, GPS, ברק ועוד.">
<meta name="theme-color" content="#fff7ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15171c" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{
  --bg:#fff7ec; --card:#ffffff; --ink:#1d1b16; --muted:#6f685c; --line:#eadfcd;
  --accent:#e2572b; --accent-ink:#ffffff; --soft:#ffe9d6;
  --ok:#1f8a4c; --ok-bg:#e2f5e9; --bad:#c0392b; --bad-bg:#fbe6e3;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#15171c; --card:#1f232b; --ink:#f1ede4; --muted:#a39d91; --line:#30353f;
    --accent:#ff7a4d; --accent-ink:#1a0e08; --soft:#33241c;
    --ok:#5fd08a; --ok-bg:#173524; --bad:#ff8a7a; --bad-bg:#3d1f1b;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI","Heebo","Arial Hebrew",Arial,sans-serif;
  font-size:17px;line-height:1.6;-webkit-tap-highlight-color:transparent}
#app{max-width:560px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));min-height:100dvh;display:flex;flex-direction:column}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
h1{font-size:26px;margin:0;letter-spacing:-.3px}
h2{font-size:15px;margin:26px 4px 8px;color:var(--muted);font-weight:600}
h3{font-size:22px;line-height:1.35;margin:10px 0 8px}
p{margin:0 0 10px}
.muted{color:var(--muted);font-size:15px}

.top{display:flex;align-items:center;justify-content:space-between;margin:6px 0 16px}
.stats{display:flex;gap:8px;font-size:14px;font-weight:600}
.stats span{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 10px}

.hero{display:flex;flex-direction:column;gap:2px;background:var(--accent);color:var(--accent-ink);
  border-radius:24px;padding:20px;position:relative;overflow:hidden}
.hero-label{font-size:13px;font-weight:700;opacity:.85}
.hero-emoji{position:absolute;inset-inline-end:14px;top:10px;font-size:64px;line-height:1}
.hero b{font-size:28px;margin-top:22px}
.hero .btn{align-self:flex-start;margin-top:14px;background:var(--accent-ink);color:var(--accent)}

.review-banner{display:flex;justify-content:space-between;margin-top:12px;padding:14px 16px;border-radius:16px;
  background:var(--soft);font-weight:600}

.search{width:100%;margin-top:18px;padding:13px 16px;border-radius:14px;border:1px solid var(--line);
  background:var(--card);color:var(--ink);font:inherit}
.search:focus{outline:2px solid var(--accent);outline-offset:1px}

.list{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row-emoji{font-size:28px;width:40px;text-align:center}
.row-text{flex:1;display:flex;flex-direction:column;min-width:0}
.row-text small{color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-mark{color:var(--muted);font-weight:700;width:20px;text-align:center}
.empty{text-align:center;color:var(--muted);margin-top:30px}

footer{margin-top:auto;padding-top:28px;text-align:center}
.link{background:none;border:0;color:var(--muted);font-size:14px;text-decoration:underline;padding:8px}

.btn{display:inline-flex;align-items:center;justify-content:center;min-height:50px;padding:0 22px;border:0;border-radius:999px;
  background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:17px}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
.btn:disabled{opacity:.4;cursor:default}

.player-top{display:flex;align-items:center;gap:12px;margin:4px 0 14px}
.close{font-size:20px;width:40px;height:40px;display:grid;place-items:center;border-radius:50%;color:var(--muted)}
.bar{flex:1;height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .25s}
.count{font-size:14px;color:var(--muted);font-weight:600;white-space:nowrap}

.stage{flex:1;display:flex;flex-direction:column;justify-content:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:22px;animation:in .22s ease-out}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.card{animation:none}.bar i{transition:none}}
.tag{display:inline-block;font-size:13px;font-weight:700;color:var(--accent);background:var(--soft);border-radius:99px;padding:3px 10px}
.big{font-size:64px;line-height:1.1;margin:10px 0 2px}
.card.end{text-align:center}
.card.myth h3{font-weight:600}

.opts{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.opt{text-align:start;padding:14px 16px;border-radius:16px;border:1.5px solid var(--line);background:transparent;line-height:1.45}
.opt:not(:disabled):active{border-color:var(--accent)}
.opt.right{border-color:var(--ok);background:var(--ok-bg);color:var(--ink);opacity:1}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg);color:var(--ink);opacity:1}
.opt:disabled{cursor:default}
.reveal{margin-top:14px;padding:12px 14px;border-radius:14px;background:var(--soft)}

.player-nav{display:flex;justify-content:space-between;gap:12px;margin-top:16px}
.player-nav .btn:last-child{flex:1}
</style>
</head>
<body>
<div id="app"></div>
<script type="module" src="app.js"></script>
</body>
</html>
