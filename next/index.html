<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><title>מאחורי הקלעים</title>
<meta http-equiv="refresh" content="0; url=../">
<script>
// הגרסה החדשה עברה לכתובת הראשית. מנקים את ההתקנה הזמנית ועוברים לשם.
(async () => { try { const rs = await navigator.serviceWorker.getRegistrations(); await Promise.all(rs.filter((r) => r.scope.endsWith("/next/")).map((r) => r.unregister()));
  const ks = await caches.keys(); await Promise.all(ks.filter((k) => k.startsWith("mk2-")).map((k) => caches.delete(k))); } catch (e) {} location.replace("../" + location.hash); })();
</script></head><body><a href="../">מאחורי הקלעים</a></body></html>
